# ~/.tmux.conf

# --- Theme ---
set -g @plugin 'tmux-plugins/tpm' # mandatory
set -g @plugin 'tmux-plugins/tmux-sensible' # optional recommended

# --- General ---
# Set the default terminal type.
# This helps preserve colors and other terminal features. "tmux-256color" is a modern default.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:Tc"
# Enable mouse support for scrolling, pane selection, and window selection.
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# --- Keybindings ---

# Create a new window with Ctrl+t
bind-key -n C-t new-window -c "#{pane_current_path}"

# Switch to windows 1-9 with Alt+<number>
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# switch to panes using Alt+<hjkl>
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# switch to panes using Prefix+<hjkl>
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
# Keep one palette active; uncomment the replacement and comment this source-file.
source-file ~/.config/tmux/themes/everforest_dark_hard.conf
# Everforest alternatives:
# source-file ~/.config/tmux/themes/everforest_dark_medium.conf
# source-file ~/.config/tmux/themes/everforest_dark_soft.conf
# source-file ~/.config/tmux/themes/everforest_light_hard.conf
# source-file ~/.config/tmux/themes/everforest_light_medium.conf
# source-file ~/.config/tmux/themes/everforest_light_soft.conf
# Solarized alternatives:
# source-file ~/.config/tmux/themes/solarized_dark.conf
# source-file ~/.config/tmux/themes/solarized_light.conf

# Forward the focused pane's title to the outer terminal (Alacritty).
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -gw allow-set-title on

# Compact segmented status line: machine uptime, focused-pane directory, windows.
set -g status-interval 15
set -g status-left-length 100
set -g status-left "#[fg=#{@theme_bg},bg=#{@theme_blue},bold]  #S #[fg=#{@theme_blue},bg=#{@theme_pink}]#[fg=#{@theme_bg},bg=#{@theme_pink},bold] ↑ #(uptime -p | sed -E 's/^up //; s/,//g; s/ days?/d/; s/ hours?/h/; s/ minutes?/m/') #[fg=#{@theme_pink},bg=#{@theme_bg}]"
set -g window-status-format "#{?window_bell_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_red}]#[fg=#{@theme_bg}]#[bold] #I #W #[fg=#{@theme_red}]#[bg=#{@theme_bg}],#{?window_activity_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_red}]#[fg=#{@theme_bg}]#[bold] #I #W #[fg=#{@theme_red}]#[bg=#{@theme_bg}],#[fg=#{@theme_muted}]#[bg=#{@theme_bg}] #I #W }}"
set -g window-status-current-format "#{?window_bell_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_red}]#[fg=#{@theme_bg}]#[bold] #I #W #[fg=#{@theme_red}]#[bg=#{@theme_bg}],#{?window_activity_flag,#[fg=#{@theme_bg}]#[bg=#{@theme_red}]#[fg=#{@theme_bg}]#[bold] #I #W #[fg=#{@theme_red}]#[bg=#{@theme_bg}],#[fg=#{@theme_bg}]#[bg=#{@theme_yellow}]#[fg=#{@theme_bg}]#[bold] #I #W #[fg=#{@theme_yellow}]#[bg=#{@theme_bg}]}}"
set -g window-status-separator ""
set -g status-right "#[fg=#{@theme_pink},bg=#{@theme_bg}]#[fg=#{@theme_bg},bg=#{@theme_pink},bold]  %H:%M #[fg=#{@theme_blue},bg=#{@theme_pink}]#[fg=#{@theme_bg},bg=#{@theme_blue},bold]  #{s|^/home/bets/|~/|:pane_current_path} "
set -g status-right-length 80

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Solarized Light palette
set -g @theme_bg '#fdf6e3'
set -g @theme_surface '#eee8d5'
set -g @theme_fg '#657b83'
set -g @theme_muted '#93a1a1'
set -g @theme_green '#859900'
set -g @theme_blue '#268bd2'
set -g @theme_red '#dc322f'
set -g @theme_yellow '#b58900'
set -g @theme_pink '#d33682'
set -g status-style 'fg=#657b83,bg=#fdf6e3'
set -g status-left-style 'fg=#657b83,bg=#fdf6e3'
set -g status-right-style 'fg=#657b83,bg=#fdf6e3'
set -g window-status-style 'fg=#93a1a1,bg=#fdf6e3'
set -g window-status-current-style 'fg=#fdf6e3,bg=#b58900,bold'
set -g window-status-activity-style 'fg=#fdf6e3,bg=#dc322f,bold'
set -g window-status-bell-style 'fg=#fdf6e3,bg=#dc322f,bold'
set -g pane-border-style 'fg=#eee8d5'
set -g pane-active-border-style 'fg=#2aa198'
set -g message-style 'fg=#657b83,bg=#eee8d5'
set -g message-command-style 'fg=#657b83,bg=#eee8d5'
set -g mode-style 'fg=#fdf6e3,bg=#b58900,bold'
set -g clock-mode-colour '#b58900'

# Solarized Dark palette
set -g @theme_bg '#002b36'
set -g @theme_surface '#073642'
set -g @theme_fg '#839496'
set -g @theme_muted '#586e75'
set -g @theme_green '#859900'
set -g @theme_blue '#268bd2'
set -g @theme_red '#dc322f'
set -g @theme_yellow '#b58900'
set -g @theme_pink '#d33682'
set -g status-style 'fg=#839496,bg=#002b36'
set -g status-left-style 'fg=#839496,bg=#002b36'
set -g status-right-style 'fg=#839496,bg=#002b36'
set -g window-status-style 'fg=#586e75,bg=#002b36'
set -g window-status-current-style 'fg=#002b36,bg=#b58900,bold'
set -g window-status-activity-style 'fg=#002b36,bg=#dc322f,bold'
set -g window-status-bell-style 'fg=#002b36,bg=#dc322f,bold'
set -g pane-border-style 'fg=#073642'
set -g pane-active-border-style 'fg=#2aa198'
set -g message-style 'fg=#839496,bg=#073642'
set -g message-command-style 'fg=#839496,bg=#073642'
set -g mode-style 'fg=#002b36,bg=#b58900,bold'
set -g clock-mode-colour '#b58900'

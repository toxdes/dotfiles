[general]
import = [
    # Keep one theme active; uncomment the replacement and comment this import.
    "~/.config/alacritty/themes/everforest_dark_hard.toml",
    # Everforest alternatives:
    # "~/.config/alacritty/themes/everforest_dark_medium.toml",
    # "~/.config/alacritty/themes/everforest_dark_soft.toml",
    # "~/.config/alacritty/themes/everforest_light_hard.toml",
    # "~/.config/alacritty/themes/everforest_light_medium.toml",
    # "~/.config/alacritty/themes/everforest_light_soft.toml",
    # Solarized alternatives:
    # "~/.config/alacritty/themes/solarized_dark.toml",
    # "~/.config/alacritty/themes/solarized_light.toml",
]

[window]
opacity = 1
padding = { x = 1, y = 1 }
dynamic_padding = true
decorations = "Full"
dimensions = { columns = 80, lines = 24 }


[font]
# size = 12.25
size = 12
offset.y = 0

[font.normal]
family = "Berkeley Mono NF"
style = "Regular"

[font.bold]
family = "Berkeley Mono NF"
style = "Bold"

[font.italic]
family = "Berkeley Mono NF"
style = "Oblique"

[font.bold_italic]
family = "Berkeley Mono NF"
style = "Bold Oblique"

[selection]
save_to_clipboard = false

[cursor.style]
blinking = "Off"

[mouse]
bindings = [
  { mouse = "Right", action = "Copy" }
]

